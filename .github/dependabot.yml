version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      microsoft-graph:
        patterns:
          - "Microsoft.Graph*"
      identity:
        patterns:
          - "Microsoft.Identity.Client*"
      mcp:
        patterns:
          - "ModelContextProtocol*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
