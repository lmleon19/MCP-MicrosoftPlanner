name: Reporte de error
description: Indica un comportamiento incorrecto del servidor MCP.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Un reporte completo acelera la solución.
  - type: input
    id: version
    attributes:
      label: Versión del ejecutable
      description: La que muestra la herramienta de identidad o la etiqueta del archivo publicado.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Paquete autocontenido
        - .NET 10 SDK
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Pasos numerados que llevan al comportamiento incorrecto.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
      description: Incluya el mensaje de error o la salida, sin tokens ni identificadores.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan de Planner afectado
      description: Nombre del plan, si aplica.
  - type: checkboxes
    id: seguridad
    attributes:
      label: Seguridad
      options:
        - label: El reporte no expone tokens, secretos ni datos personales.
